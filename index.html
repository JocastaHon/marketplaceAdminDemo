  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

g a product to confirming your meeting slot.','Frequently Asked Questions':'Quick answers to the most common billing and subscription questions from Zoo Office users.'};\nfunction card(title){return `<button class=&quot;article&quot; data-title=&quot;${title}&quot;><span class=&quot;ico&quot;>▧<\u002Fspan><span style=&quot;text-align:left&quot;><strong>${title}<\u002Fstrong><p>${descriptions[title]||'Helpful instructions, details, and recommended steps for this topic.'}<\u002Fp><small>◉ ${48+title.length*3} views<\u002Fsmall><\u002Fspan><span style=&quot;margin-left:auto;color:#C5CAD3&quot;>→<\u002Fspan><\u002Fbutton>`}\ncategoriesEl=document.getElementById('categories');categoriesEl.innerHTML=categories.map((c,i)=>`<button class=&quot;category&quot; data-cat=&quot;${c.name}&quot;><span class=&quot;cat-icon ${c.cls}&quot;>${c.icon}<\u002Fspan><strong>${c.name}<\u002Fstrong><span>${c.count} articles<\u002Fspan><\u002Fbutton>`).join('');\ndocument.getElementById('popular').innerHTML=['Frequently Asked Questions','How to Book a Demo Meeting','Welcome to Zoo Office Marketplace','API Authentication and Portal Integrations','Understanding Your Analytics Dashboard','How to Install Your First App','Two-Factor Authentication Setup','Rescheduling or Cancelling a Meeting'].map(card).join('');\nfunction openCategory(name){const c=categories.find(x=>x.name===name);docsHome.style.display='none';categoryView.style.display='block';categoryName.textContent=name;categoryCount.textContent=c.count+' articles in this category';categoryIcon.className='cat-icon '+c.cls;categoryIcon.textContent=c.icon;renderCat(name);otherCategories.innerHTML=categories.filter(x=>x.name!==name).map(x=>`<button class=&quot;chip&quot; data-cat=&quot;${x.name}&quot;>${x.icon} &amp;nbsp;${x.name}<\u002Fbutton>`).join('');document.querySelectorAll('#otherCategories [data-cat]').forEach(b=>b.onclick=()=>openCategory(b.dataset.cat))}\nfunction renderCat(name,q=''){categoryArticles.innerHTML=articles[name].filter(x=>x.toLowerCase().includes(q.toLowerCase())).map(card).join('')}\ndocument.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>openCategory(b.dataset.cat));backDocs.onclick=()=>{categoryView.style.display='none';docsHome.style.display='block'};catSearch.oninput=()=>renderCat(categoryName.textContent,catSearch.value);\ndocSearch.oninput=()=>{const q=docSearch.value.toLowerCase();document.querySelectorAll('#popular .article').forEach(a=>a.style.display=a.textContent.toLowerCase().includes(q)?'flex':'none')};\nconst vids=[['Getting Started with Zoo Office Marketplace','Onboarding','4:32','2.1k views'],['How to Book and Manage Demo Meetings','Meetings','6:14','1.8k views'],['Setting Up Roles and Permissions','Security','3:55','943 views']];featured.innerHTML=vids.map((v,i)=>`<button class=&quot;video video-open&quot; data-i=&quot;${i}&quot; style=&quot;border:0;text-align:left&quot;><div class=&quot;thumb&quot;><span class=&quot;play&quot;>▶<\u002Fspan><span class=&quot;duration&quot;>${v[2]}<\u002Fspan><\u002Fdiv><div class=&quot;video-copy&quot;><strong>${v[0]}<\u002Fstrong><small>◉ ${v[3]} &amp;nbsp; ◷ ${v[2]}<\u002Fsmall><\u002Fdiv><\u002Fbutton>`).join('');const allV=[...vids,['Two-Factor Authentication Setup','Security','3:10','822 views'],['Marketplace App Installation Deep Dive','Apps','8:15','731 views'],['Understanding Your Invoice Dashboard','Billing','5:02','612 views'],['Managing Subscriptions and Billing','Billing','5:33','567 views'],['Configuring Notification Preferences','Settings','2:47','504 views']];function renderVideos(q=''){tutorialList.innerHTML=allV.filter(v=>v[0].toLowerCase().includes(q.toLowerCase())).map((v,i)=>`<button class=&quot;tutorial video-open&quot; data-title=&quot;${v[0]}&quot; data-duration=&quot;${v[2]}&quot; data-meta=&quot;${v[3]}&quot; style=&quot;border:0;text-align:left&quot;><span class=&quot;playtiny&quot;>▶<\u002Fspan><span><strong>${v[0]}<\u002Fstrong><small>${v[1]} &amp;nbsp; ◷ ${v[2]} &amp;nbsp; ◉ ${v[3]}<\u002Fsm Id('createAppOverlay').style.display='flex';createAppGoBack();validateCreateApp();}\nfunction closeCreateApp(){document.getElementById('createAppOverlay').style.display='none';}\nfunction validateCreateApp(){var ok=document.getElementById('caName').value.trim()&&document.getElementById('caApi').value.trim()&&document.getElementById('caDesc').value.trim()&&document.getElementById('caCategory').value;document.getElementById('createAppContinue').disabled=!ok;}\nfunction selectAppPrice(el){document.querySelectorAll('#createAppDetails .choice-card').forEach(function(x){x.classList.remove('selected')});el.classList.add('selected');}\nfunction selectDeploy(el){document.querySelectorAll('#createAppDetails .deploy-card').forEach(function(x){x.classList.remove('selected')});el.classList.add('selected');}\nfunction createAppNext(){if(document.getElementById('createAppContinue').disabled)return;document.getElementById('createAppDetails').style.display='none';document.getElementById('createAppVerify').style.display='block';document.getElementById('createAppContinue').style.display='none';document.getElementById('createAppDeploy').style.display='flex';document.getElementById('createAppBack').style.display='block';document.getElementById('appStep1').className='app-step done';document.getElementById('appStep1').querySelector('i').textContent='✓';document.getElementById('appStep2').className='app-step active';}\nfunction createAppGoBack(){document.getElementById('createAppDetails').style.display='block';document.getElementById('createAppVerify').style.display='none';document.getElementById('createAppContinue').style.display='flex';document.getElementById('createAppDeploy').style.display='none';document.getElementById('createAppBack').style.display='none';document.getElementById('appStep1').className='app-step active';document.getElementById('appStep1').querySelector('i').textContent='1';document.getElementById('appStep2').className='app-step';}\nfunction deployNewApp(){closeCreateApp();if(typeof showPromoToast==='function')showPromoToast('App registered');}\n<\u002Fscript>\n\n\n\n<script id=\"app-edit-final-routing\">\nfunction editManagedApp(name){ openEditAppPage(name,'details'); }\nfunction managePlans(name){ openEditAppPage(name,'plans'); }\n<\u002Fscript>\n\n<style id=\"plans-fullwidth-final\">\n#editPanel-plans .app-page-card{width:100%!important;max-width:none!important;}\n#editPanel-plans .plan-editor-list{grid-template-columns:1fr!important;width:100%!important;}\n#editPanel-plans .plan-editor-card{width:100%!important;max-width:none!important;}\n#editPanel-plans .plan-editor-grid{grid-template-columns:minmax(0,1fr) minmax(220px,.42fr) minmax(220px,.42fr)!important;width:100%!important;}\n#editPanel-plans .plan-editor-grid .full{grid-column:1/-1!important;}\n@media(max-width:900px){#editPanel-plans .plan-editor-grid{grid-template-columns:1fr!important;}#editPanel-plans .plan-editor-grid .full{grid-column:auto!important;}}\n<\u002Fstyle>\n<script id=\"app-edit-routing-final\">\nfunction editManagedApp(name){ openEditAppPage(name,'details'); }\nfunction viewManagedApp(name){ openEditAppPage(name,'details'); }\n<\u002Fscript>\n<script>\nfunction makeAppCode(name){return (name||'app').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')+'-'+Math.random().toString(16).slice(2,10)}\nfunction copyEditAppCode(){var el=document.getElementById('editAppCode');if(navigator.clipboard)navigator.clipboard.writeText(el.value);}\nfunction selectEditDeployment(el){document.querySelectorAll('.edit-deploy-card').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');}\nfunction selectEditPricing(type,el){document.querySelectorAll('.pricing-choice-btn').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');document.getElementById('paidPricingOptions').style.display=type==='paid'?'block':'none';}\nfunction selectPricingMode(mode,el){document.querySelectorAll('.pricing-mode-btn').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');document.getElementById('fixedPricePanel').style.display=mode==='fixed'?'block':'none';document.getElementById('subscriptionPricingPanel').style.display=mode==='subscription'?'block':'none';}\nfunction toggleFixedPrice(){if(document.getElementById('hasFixedPrice').checked){var b=document.querySelector('.pricing-mode-btn[data-mode=\"fixed\"]');selectPricingMode('fixed',b)}}\nvar _openEditAppPage=openEditAppPage;openEditAppPage=function(name,tab){_openEditAppPage(name,tab);var d=appDrafts[name]||{};if(!d.code)d.code=makeAppCode(name);document.getElementById('editAppCode').value=d.code;document.querySelectorAll('.edit-deploy-card').forEach(x=>x.classList.toggle('selected',x.dataset.deploy===(d.deployment||'Shared')));var pricing=d.price||((d.plans&&d.plans.length)?'paid':'free');var pb=document.querySelector('.pricing-choice-btn[data-pricing=\"'+pricing+'\"]');if(pb)selectEditPricing(pricing,pb);setTimeout(function(){var c=document.getElementById('editPlanCount'),badge=document.getElementById('pricingPlanBadge');if(c&&badge){var m=c.textContent.match(/\\d+/);badge.textContent=m?m[0]:'0'}},0)};\n<\u002Fscript>\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n<script id=\"custom-date-range-reference-js\">\n(function(){\n  var dd=document.getElementById('dateDropdown');\n  if(!dd)return;\n  var options=dd.querySelectorAll('.dropdown-option');\n  options.forEach(function(opt){\n    if(opt.textContent.trim()==='Custom Date Range'){\n      opt.addEventListener('click',function(e){\n        e.stopPropagation();\n        dd.classList.add('open','custom-range-open');\n        options.forEach(function(x){x.classList.remove('selected');});\n        opt.classList.add('selected');\n      });\n    }\n  });\n})();\nfunction cancelDashboardCustomDate(e){\n  if(e)e.stopPropagation();\n  var dd=document.getElementById('dateDropdown');\n  if(dd){dd.classList.remove('custom-range-open');dd.classList.remove('open');}\n}\nfunction applyDashboardCustomDate(e){\n  if(e)e.stopPropagation();\n  var s=document.getElementById('dashboardStartDate');\n  var en=document.getElementById('dashboardEndDate');\n  var label=document.getElementById('dateLabel');\n  if(label && s && en && s.value && en.value) label.textContent=s.value+' – '+en.value;\n  var dd=document.getElementById('dateDropdown');\n  if(dd){dd.classList.remove('custom-range-open');dd.classList.remove('open');}\n}\n<\u002Fscript>\n\n\n\n\n\n\n\n\n<script id=\"dashboard-safe-landing-init\">\n(function(){\n  function initDashboardLanding(){\n    document.body.classList.add('dashboard-active');\n\n    var createBtn=document.getElementById('createAppBtn');\n    if(createBtn) createBtn.style.display='none';\n\n    var filter=document.getElementById('dateDropdown');\n    if(filter){\n      filter.style.display='block';\n      filter.classList.remove('open','custom-range-open');\n    }\n\n    /* Use the app's existing router rather than replacing it. */\n    if(typeof showView==='function') showView('dashboard');\n\n    /* Restore dashboard-only header state in case the existing router resets it. */\n    document.body.classList.add('dashboard-active');\n    if(createBtn) createBtn.style.display='none';\n    if(filter) filter.style.display='block';\n  }\n\n  if(document.readyState==='loading'){\n    document.addEventListener('DOMContentLoaded',initDashboardLanding,{once:true});\n  }else{\n    initDashboardLanding();\n  }\n})();\n<\u002Fscript>\n\n\n<script id=\"global-mmm-d-yyyy-date-format\">\nfunction formatZooDate(value){\n  if(value===null || value===undefined || value==='') return value;\n  var raw=String(value).trim();\n  var d=null;\n\n  var iso=raw.match(/^(\\d{4})-(\\d{1,2})-(\\d{1,2})(?:[T\\s].*)?$/);\n  if(iso) d=new Date(Number(iso[1]),Number(iso[2])-1,Number(iso[3]));\n\n  var slash=raw.match(/^(\\d{1,2})\\/(\\d{1,2})\\/(\\d{4})$/);\n  if(!d && slash) d=new Date(Number(slash[3]),Number(slash[1])-1,Number(slash[2]));\n\n  if(!d){\n    var parsed=new Date(raw);\n    if(!isNaN(parsed.getTime())) d=parsed;\n  }\n  if(!d || isNaN(d.getTime())) return value;\n\n  return d.toLocaleDateString('en-US',{\n    month:'short',\n    day:'numeric',\n    year:'numeric'\n  }).replace(/^([A-Z][a-z]{2}) /,'$1, ');\n}\n\n/* Format visible date cells after each render without changing date input values. */\nfunction normalizeVisibleZooDates(root){\n  root=root||document;\n  var selectors=[\n    'td','th','.date','.date-value','.created-date','.updated-date',\n    '[data-date]','[data-created]','[data-updated]'\n  ];\n  root.querySelectorAll(selectors.join(',')).forEach(function(el){\n    if(el.children.length) return;\n    var t=el.textContent.trim();\n    if(/^(\\d{4}-\\d{1,2}-\\d{1,2}|\\d{1,2}\\/\\d{1,2}\\/\\d{4}|[A-Za-z]{3,9}\\s+\\d{1,2},\\s+\\d{4})$/.test(t)){\n      el.textContent=formatZooDate(t);\n    }\n  });\n}\ndocument.addEventListener('DOMContentLoaded',function(){normalizeVisibleZooDates(document);});\n<\u002Fscript>\n\n\n<script id=\"promo-client-dropdown-js\">\n(function(){\n  var originalOpen = window.openPromoModal;\n  window.openPromoModal = function(index){\n    if(typeof originalOpen === 'function') originalOpen(index);\n    var select = document.getElementById('promoClientInput');\n    if(!select) return;\n    if(typeof index === 'number' && window.promoCodesData && promoCodesData[index]){\n      select.value = promoCodesData[index].client || 'all';\n    } else {\n      select.value = 'all';\n    }\n  };\n\n  var originalSave = window.savePromoCode;\n  window.savePromoCode = function(){\n    var select = document.getElementById('promoClientInput');\n    var selected = select ? select.value : 'all';\n    var editing = (typeof promoEditingIndex === 'number') ? promoEditingIndex : -1;\n    var before = window.promoCodesData ? promoCodesData.length : 0;\n\n    if(typeof originalSave === 'function') originalSave();\n\n    if(window.promoCodesData){\n      if(editing >= 0 && promoCodesData[ ions,{once:true});\n  }else{\n    forceTopActions();\n  }\n  window.addEventListener('load',forceTopActions,{once:true});\n})();\n<\u002Fscript>\n\n\n<style id=\"enable-toggles-working-final\">\n/* Ensure enable/active toggle controls are interactive. */\n.toggle,\n.toggle input,\n.toggle-slider,\n.switch,\n.switch input,\ninput[type=\"checkbox\"]{\n  pointer-events:auto!important;\n}\n.toggle,\n.switch{\n  cursor:pointer!important;\n}\n<\u002Fstyle>\n\n<script id=\"enable-toggles-working-final-js\">\n(function(){\n  function syncToggle(input){\n    if(!input)return;\n    var wrap=input.closest('.toggle,.switch');\n    if(wrap){\n      wrap.classList.toggle('active',input.checked);\n      wrap.classList.toggle('enabled',input.checked);\n      wrap.setAttribute('aria-checked',input.checked?'true':'false');\n    }\n  }\n\n  function initToggles(){\n    document.querySelectorAll('.toggle input[type=\"checkbox\"], .switch input[type=\"checkbox\"]').forEach(function(input){\n      syncToggle(input);\n      input.addEventListener('change',function(){\n        syncToggle(input);\n      });\n    });\n  }\n\n  /* Handle custom toggle wrappers that do not have a label/input click behavior. */\n  document.addEventListener('click',function(e){\n    var wrap=e.target.closest && e.target.closest('.toggle,.switch');\n    if(!wrap)return;\n\n    var input=wrap.querySelector('input[type=\"checkbox\"]');\n    if(!input || input.disabled)return;\n\n    /* Native clicks on the checkbox/label already toggle it. */\n    if(e.target===input || e.target.closest('label'))return;\n\n    e.preventDefault();\n    input.checked=!input.checked;\n    input.dispatchEvent(new Event('change',{bubbles:true}));\n  });\n\n  if(document.readyState==='loading'){\n    document.addEventListener('DOMContentLoaded',initToggles,{once:true});\n  }else{\n    initToggles();\n  }\n})();\n<\u002Fscript>\n\n\n\n\n<style id=\"roles-nav-editor-final-css\">\n#rolesNavEditor{display:none;position:fixed;inset:0;z-index: :28:59 AM', status: 'Active' }\n      ]\n    }\n  ];\n\n  function statusPillHtml(status){\n    var map = {\n      'Paid':      ['var(--zo-success-bg)', 'var(--zo-success)'],\n      'Active':    ['var(--zo-success-bg)', 'var(--zo-success)'],\n      'Purchased': ['var(--zo-success-bg)', 'var(--zo-success)'],\n      'Paused':    ['var(--zo-warning-bg)', 'var(--zo-warning)'],\n      'Trial':     ['var(--zo-warning-bg)', 'var(--zo-warning)'],\n      'Cancelled': ['var(--zo-danger-bg)', 'var(--zo-danger)']\n    };\n    var c = map[status] || ['var(--zo-neutral-bg)', 'var(--zo-neutral)'];\n    return '<span class=\"status-pill\" style=\"background:'+c[0]+';color:'+c[1]+';\"><span class=\"status-dot\" style=\"background:'+c[1]+';\"><\u002Fspan> ' + status + '<\u002Fspan>';\n  }\n\n  function renderClientList(){\n    var body = document.getElementById('clientTableBody');\n    var sortBy = document.getElementById('clientSortValue') ? document.getElementById('clientSortValue').value : 'name';\n\n    var sorted = clientsData.slice().sort(function(a, b){\n      if (sortBy === 'name') return a.name.localeCompare(b.name);\n      if (sortBy === 'subs') {\n        var aSubs = a.subscriptions.filter(function(s){ return s.status === 'Active'; }).length;\n        var bSubs = b.subscriptions.filter(function(s){ return s.status === 'Active'; }).length;\n        return bSubs - aSubs;\n      }\n      if (sortBy === 'installs') return b.installations.length - a.installations.length;\n      if (sortBy === 'payment') {\n        function nextDate(c){\n          var dates = c.subscriptions.filter(function(s){ return s.status === 'Active' && s.nextBilling !== '—'; })\n            .map(function(s){ return new Date(s.nextBilling); }).filter(function(d){ return !isNaN(d); });\n          return dates.length ? Math.min.apply(null, dates) : Infinity;\n        }\n        return nextDate(a) - nextDate(b);\n      }\n      return 0;\n    });\n\n    body.innerHTML = sorted.map(function(c){\n      var activeSubs = c.subscriptions.filter(function(s){ return s.status === 'Active'; }).length;\n      var outstanding = '$0.00';\n      return '<div class=\"client-row\" onclick=\"showClientDetail(\\''+c.id+'\\')\">' +\n        '<div class=\"client-cell\"><span class=\"setup-icon\">'+c.initial+'<\u002Fspan><div><div class=\"client-name\">'+c.name+'<\u002Fdiv><div class=\"client-email\">'+c.email+'<\u002Fdiv><\u002Fdiv><\u002Fdiv>' +\n        '<div>'+activeSubs+' active<\u002Fdiv>' +\n        '<div>'+c.installations.length+'<\u002Fdiv>' +\n        '<div>'+outstanding+'<\u002Fdiv>' +\n        '<div class=\"client-row-chevron\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"9 18 15 12 9 6\"/><\u002Fsvg><\u002Fdiv>' +\n      '<\u002Fdiv>';\n    }).join('');\n  }\n\n  function getFilteredInvoices(c, dateFromOverride, dateToOverride){\n    var search = document.getElementById('invoiceSearchFilter').value.trim().toLowerCase();\n    var status = document.getElementById('invoiceStatusFilter').value;\n    var app = document.getElementById('invoiceAppFilter').value;\n    var dateFrom = (dateFromOverride !== undefined) ? dateFromOverride : document.getElementById('invoiceDateFrom').value;\n    var dateTo = (dateToOverride !== undefined) ? dateToOverride : document.getElementById('invoiceDateTo').value;\n\n    return c.invoices.filter(function(i){\n      if (status !== 'All' && i.status !== status) return false;\n      if (app !== 'All' && i.app !== app) return false;\n      if (search && !(i.inv.toLowerCase().indexOf(search) > -1 || i.app.toLowerCase().indexOf(search) > -1)) return false;\n      var invDate = new Date(i.date);\n      if (dateFrom && invDate < new Date(dateFrom)) return false;\n      if (dateTo && invDate > new Date(dateTo)) return false;\n      return true;\n    });\n  }\n\n  function renderInvoices(c){\n    var list = getFilteredInvoices , 10);\n  }\n\n  function openExportModal(scope){\n    exportScope = scope;\n    var c = clientsData.find(function(x){ return x.id === currentClientId; });\n    document.getElementById('exportModalTitle').textContent = (scope === 'all')\n      ? 'Export All Clients\\u2019 Invoices'\n      : 'Export ' + (c ? c.name : 'Client') + '\\u2019s Invoices';\n    document.getElementById('exportStartDate').value = daysAgoISO(30);\n    document.getElementById('exportEndDate').value = todayISO();\n    document.getElementById('exportModalOverlay').style.display = 'flex';\n  }\n\n  function closeExportModal(){\n    document.getElementById('exportModalOverlay').style.display = 'none';\n  }\n\n  function performExport(){\n    var start = document.getElementById('exportStartDate').value;\n    var end = document.getElementById('exportEndDate').value;\n    if (exportScope === 'all') {\n      exportAllInvoicesCSV(start, end);\n    } else {\n      exportInvoicesCSV(start, end);\n    }\n    closeExportModal();\n  }\n\n  function exportAllInvoicesCSV(dateFrom, dateTo){\n    var header = ['Client', 'Email', 'Invoice', 'Date', 'App', 'Description', 'Amount', 'Status'];\n    var lines = [header.join(',')];\n    clientsData.forEach(function(c){\n      c.invoices.forEach(function(i){\n        var invDate = new Date(i.date);\n        if (dateFrom && invDate < new Date(dateFrom)) return;\n        if (dateTo && invDate > new Date(dateTo)) return;\n        var line = [\n          '\"' + c.name.replace(/\"/g, '\"\"') + '\"',\n          c.email,\n          i.inv, i.date, i.app,\n          '\"' + i.desc.replace(/\"/g, '\"\"') + '\"',\n          i.amount, i.status\n        ];\n        lines.push(line.join(','));\n      });\n    });\n    var csv = lines.join('\\n');\n    var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });\n    var url = URL.createObjectURL(blob);\n    var a = document.createElement('a');\n    a.href = url;\n    a.download = 'all_clients_invoices.csv';\n    document.body.app AppOption(this, \\'All\\', \\'All Apps\\')\">All Apps<\u002Fdiv>' +\n      subApps.map(function(a){ return '<div class=\"dropdown-option\" onclick=\"selectSubAppOption(this, \\''+a+'\\', \\''+a+'\\')\">'+a+'<\u002Fdiv>'; }).join('');\n    document.getElementById('subAppFilter').value = 'All';\n    document.getElementById('subAppLabel').textContent = 'All Apps';\n    document.getElementById('subUserOptions').innerHTML =\n      '<div class=\"dropdown-option selected\" onclick=\"selectSubUserOption(this, \\'All\\', \\'All Users\\')\">All Users<\u002Fdiv>' +\n      '<div class=\"dropdown-option\" onclick=\"selectSubUserOption(this, \\''+c.email+'\\', \\''+c.email+'\\')\">'+c.email+'<\u002Fdiv>';\n    document.getElementById('subUserFilter').value = 'All';\n    document.getElementById('subUserLabel').textContent = 'All Users';\n    renderSubscriptions(c);\n\n    switchBillingTab('invoices');\n  }\n\n  function resetDropdown(dropdownId, hiddenId, labelId, value, label){\n    document.getElementById(hiddenId).value = value;\n    document.getElementById(labelId).textContent = label;\n    document.querySelectorAll('#'+dropdownId+' .dropdown-option').forEach(function(o, idx){ o.classList.toggle('selected', idx === 0); });\n  }\n\n  function selectInvoiceAppOption(el, value, label){\n    var panel = el.closest('.custom-dropdown-panel');\n    panel.querySelectorAll('.dropdown-option').forEach(function(o){ o.classList.remove('selected'); });\n    el.classList.add('selected');\n    document.getElementById('invoiceAppLabel').textContent = label;\n    document.getElementById('invoiceAppFilter').value = value;\n    document.getElementById('invoiceAppDropdown').classList.remove('open');\n    filterInvoices();\n  }\n\n  /* ---------------- Installations ---------------- */\n  function getFilteredInstallations(c){\n    var search = document.getElementById('installSearchFilter').value.trim().toLowerCase();\n    var status = document.getElementById('installStatusFilter').value;\n    retu =\"rpx-slider\"><\u002Fspan><\u002Fspan><\u002Flabel>';\n  }).join('')+'<\u002Fdiv><\u002Fsection>';\n }).join('');\n document.querySelectorAll('#rpxBody input:not(:disabled)').forEach(function(x){\n  x.onchange=function(){\n   var id=this.dataset.id;\n   if(this.checked){if(current.enabled.indexOf(id)<0)current.enabled.push(id)}\n   else current.enabled=current.enabled.filter(function(v){return v!==id});\n   renderPages();\n  };\n });\n}\nfunction initials(n){return n.split(/\\s+/).map(function(x){return x.charAt(0)}).join('').slice(0,2).toUpperCase()}\nfunction open(role,user,email){\n var ov=document.getElementById('rpxOverlay')||buildOverlay();\n current={role:role,enabled:(saved[role]||defaults[role]||locked).slice()};\n document.getElementById('rpxAvatar').textContent=initials(user||role);\n document.getElementById('rpxRole').textContent=user||role;\n document.getElementById('rpxBadge').textContent=role;\n document.getElementById('rpxSub').textContent=email||(role+' role');\n document.getElementById('rpxNote').textContent='Page access is set on the '+role+' role. Changes apply to every '+role+' user.';\n renderPages();ov.classList.add('open');\n}\nfunction close(){var ov=document.getElementById('rpxOverlay');if(ov)ov.classList.remove('open')}\nfunction save(){\n saved[current.role]=current.enabled.slice();\n var n=current.enabled.length,total=allIds().length;\n rows().forEach(function(r){\n  if(r.dataset.roleName!==current.role)return;\n  var mod=r.querySelector('.fru-mod')||r.children[2],acc=r.querySelector('.fru-access');\n  if(mod)mod.textContent=n+' / '+total;\n  if(acc)acc.textContent='Role default';\n });\n close();\n if(typeof window.showPromoToast==='function')window.showPromoToast('Page access updated for '+current.role);\n}\n\n/* Re-create the Edit buttons so older per-user matrix handlers no longer match them. */\nfunction rebindEdit(){\n rows().forEach(function(r){\n  var old=r.querySelector('.fru-edit, .role-edit');if(!old)return;\n  var user=(old.dataset.user||(r.querySelector('.fru-user strong')||{}).textContent||'').trim();\n  var role=(old.dataset.role||(r.querySelector('.fru-role')||{}).textContent||'').trim();\n  var email=((r.querySelector('.fru-user small')||{}).textContent||'').trim();\n  r.dataset.roleName=role;\n  var b=document.createElement('button');\n  b.type='button';b.className='rpx-trigger';b.setAttribute('aria-label','Edit page access for '+user);\n  b.innerHTML=old.innerHTML;\n  b.addEventListener('click',function(e){\n   e.preventDefault();e.stopPropagation();\n   var pages=userPages[user]||(saved[role]||defaults[role]||locked).slice();\n   if(window.rolesOpenUserEditor)window.rolesOpenUserEditor({name:user,email:email,role:role,enabled:pages,row:r});\n   else open(role,user,email);\n  });\n  old.parentNode.replaceChild(b,old);\n });\n window.openSideNavPermissionsPopup=function(role){open(role);return false};\n}\nfunction normalizeCounts(){\n var total=allIds().length;\n rows().forEach(function(r){\n  var role=r.dataset.roleName,mod=r.querySelector('.fru-mod')||r.children[2],acc=r.querySelector('.fru-access');\n  if(!mod||!role)return;\n  var custom=acc&&/custom/i.test(acc.textContent||'');\n  var base=(saved[role]||defaults[role]||locked).length;\n  var n=custom?Math.max(1,base-2):base;\n  mod.textContent=n+' / '+total;\n });\n}\nfunction boot(){\n if(!usersTable())return setTimeout(boot,300);\n rebindEdit();normalizeCounts();placeFooter();paint();\n window.rolesRepaint=function(){page=1;paint()};\n window.rolesRebind=function(){rebindEdit();paint()};\n window.rolesTotalPages=function(){return allIds().length};\n window.rolesDefaultCount=function(r){return (saved[r]||defaults[r]||locked).length};\n window.rolesRegisterRole=function(r){if(!defaults[r])defaults[r]=(defaults.Sales||locked).slice()};\n window.rolesPageGroups=function(){return groups};\n window.rolesRoleDefault=function(r){return (saved[r]||defaults[r]||locked).slice()};\n window.rolesSetUserPages=function(u,list){userPages[u]=list.slice()};\n}\nif(document.readyState==='loading')document.addEventListener('DOMContentLoaded',function(){setTimeout(boot,700)});else setTimeout(boot,700);\n})();\n<\u002Fscript>\n\n<style id=\"role-editor-page-and-filter\">\n#rolesView .roles-toolbar{display:flex!important;align-items:center;gap:10px}\n#rolesView .roles-search{flex:1 1 auto!important;min-width:280px!important}\n#rolesView .roles-search input{width:100%!important;min-width:0!important}\n#rolesView .roles-filter{flex:0 0 200px!important;width:200px!important;min-width:200px!important}\nbody.role-editor-open .page-header-row{display:none!important}\nbody.role-editor-open #rolesHeaderNewBtn{display:none!important}\n#roleEditorView{padding:84px 28px 40px;background:var(--zo-bg);overflow-y:auto}\n#roleEditorView .drilldown-header{position:static;padding:0 0 16px;background:transparent;border-bottom:1px solid var(--zo-line);margin-bottom:22px}\n#roleEditorView .drilldown-header-top{display:flex!important;align-items:center!important;justify-content:space-between!important;position:static!important;min-height:42px;margin-bottom:14px}\n#roleEditorView .drilldown-back{display:inline-flex!important;align-items:center;gap:6px;position:static!important;visibility:visible!important;opacity:1!important;white-space:nowrap}\n#roleEditorView .drilldown-actions{display:flex!important;align-items:center;gap:10px;position:static!important;width:auto!important;flex:none}\n#roleEditorView .drilldown-actions > button{position:static!important;display:inline-flex!important;align-items:center;justify-content:center;white-space:nowrap}\n#roleEditorView .role-users-list{display:flex;flex-direction:column;gap:10px}\n#roleEditorView .role-user-row{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1.4fr) 132px 36px;gap:10px;align-items:center}\n#roleEditorView .role-user-row input,#roleEditorView .role-user-row select{height:40px;width:100%;border:1px solid var(--zo-line-input);border-radius:6px;background:#fff t();\n }\n sel.onchange=apply;if(search)search.oninput=apply;\n window.filterCurrentRoles=apply;\n apply();\n}\n\n/* ---------- New Role page ---------- */\nfunction buildPage(){\n var host=document.getElementById('clientEditorView');if(!host)return null;\n var v=document.createElement('div');\n v.className='content client-editor-page';v.id='roleEditorView';v.style.display='none';\n v.innerHTML=\n '<div class=\"drilldown-header client-editor-header\"><div class=\"drilldown-header-top\">'+\n  '<button class=\"drilldown-back\" type=\"button\" id=\"roleEditorBack\">← Back to Roles &amp; Permissions<\u002Fbutton>'+\n  '<div class=\"drilldown-actions\"><button class=\"drilldown-cancel\" type=\"button\" id=\"roleEditorCancel\">Cancel<\u002Fbutton>'+\n  '<button class=\"drilldown-primary\" type=\"button\" id=\"roleEditorSubmit\">Create User<\u002Fbutton><\u002Fdiv>'+\n '<\u002Fdiv><div class=\"drilldown-title\">Add New User<\u002Fdiv>'+\n '<div class=\"drilldown-subtitle\">Create an account, choose the role it belongs to, and control what it can access.<\u002Fdiv><\u002Fdiv>'+\n '<div class=\"client-editor-layout\">'+\n  '<section class=\"client-editor-card\"><div class=\"client-editor-card-head\"><div><h3>User details<\u002Fh3><p>Profile, role, and account status.<\u002Fp><\u002Fdiv><\u002Fdiv>'+\n   '<div class=\"client-editor-card-body client-editor-fields\">'+\n    '<label class=\"client-editor-field\"><span>Full name <b>*<\u002Fb><\u002Fspan><input id=\"ruPageName\" placeholder=\"Enter the user\\'s full name\"><\u002Flabel>'+\n    '<label class=\"client-editor-field\"><span>Email address <b>*<\u002Fb><\u002Fspan><input id=\"ruPageEmail\" type=\"email\" placeholder=\"name@zenatech.com\"><\u002Flabel>'+\n    '<label class=\"client-editor-field\"><span>Role <b>*<\u002Fb><\u002Fspan><select id=\"ruPageRole\"><\u002Fselect><\u002Flabel>'+\n    '<label class=\"client-editor-field\"><span>Job title<\u002Fspan><input id=\"ruPageTitle\" placeholder=\"e.g. Account Executive\"><\u002Flabel>'+\n    '<label class=\"client-editor-field\"><span>Phone number<\u002Fspan><input id=\"ruPagePhone\" placeholder=\"+1 (555) 000-0000\"><\u002Flabel>'+\n    '<label class=\"client-editor-field\"><span>Timezone <b>*<\u002Fb><\u002Fspan><select id=\"ruPageTimezone\"><option>America/Toronto<\u002Foption><option>America/New_York<\u002Foption><option>America/Chicago<\u002Foption><option>America/Los_Angeles<\u002Foption><\u002Fselect><\u002Flabel>'+\n    '<label class=\"client-editor-field full\"><span>Temporary password<\u002Fspan><input id=\"ruPagePassword\" type=\"password\" placeholder=\"Leave blank to send a password setup link\"><small>The user can use SSO or create a password from their welcome email.<\u002Fsmall><\u002Flabel>'+\n    '<div class=\"client-account-setting full\"><div><strong>Active account<\u002Fstrong><small>Allow this user to sign in immediately.<\u002Fsmall><\u002Fdiv><label class=\"client-page-switch\"><input id=\"ruPageActive\" type=\"checkbox\" checked><span><\u002Fspan><\u002Flabel><\u002Fdiv>'+\n    '<div class=\"client-account-setting full\"><div><strong>Send welcome email<\u002Fstrong><small>Email an invitation to join the system.<\u002Fsmall><\u002Fdiv><label class=\"client-page-switch\"><input id=\"ruPageWelcome\" type=\"checkbox\" checked><span><\u002Fspan><\u002Flabel><\u002Fdiv>'+\n   '<\u002Fdiv><\u002Fsection>'+\n  '<section class=\"client-editor-card permissions-card\">'+\n   '<div class=\"client-editor-card-head\"><div><h3>Permissions<\u002Fh3><p>Choose which pages and tools this user can see. Defaults come from the selected role.<\u002Fp><\u002Fdiv><span class=\"permission-summary\" id=\"ruPermSummary\">0 enabled<\u002Fspan><\u002Fdiv>'+\n   '<div class=\"client-editor-card-body\" id=\"ruPermBody\"><\u002Fdiv>'+\n  '<\u002Fsection>'+\n '<\u002Fdiv><div class=\"role-editor-error\" id=\"roleEditorError\"><\u002Fdiv>';\n host.parentNode.insertBefore(v,host.nextSibling);\n v.querySelector('#roleEditorBack').onclick=v.querySelector('#roleEditorCancel').onclick=close;\n v.querySelector('#roleEditorSubmit').onclick=save;\n v.querySelector('#ruPageRole').onchange=function(){resetPerms();renderPerms()};\n return v;\n}\nfunction setMode(m){\n mode=m;\n var isEdit=m==='edit';\n document.querySelector('#roleEditorView .drilldown-title').textContent=isEdit?'Edit User':'Add New User';\n document.querySelector('#roleEditorView .drilldown-subtitle').textContent=isEdit\n  ?'Update this user\\'s details, role, and page access.'\n  :'Create an account, choose the role it belongs to, and control what it can access.';\n document.getElementById('roleEditorSubmit').textContent=isEdit?'Save Changes':'Create User';\n var pw=document.getElementById('ruPagePassword').closest('.client-editor-field');\n if(pw)pw.querySelector('span').innerHTML=isEdit?'Reset password':'Temporary password';\n var wel=document.getElementById('ruPageWelcome').closest('.client-account-setting');\n if(wel){wel.querySelector('strong').textContent=isEdit?'Notify the user':'Send welcome email';\n  wel.querySelector('small').textContent=isEdit?'Email them about these changes.':'Email an invitation to join the system.';}\n}\nvar groupsRef=null,enabled=[],mode='create',editingRow=null;\nfunction pageGroups(){\n if(!groupsRef&&window.rolesPageGroups)groupsRef=window.rolesPageGroups();\n return groupsRef||[];\n}\nfunction resetPerms(){\n var role=document.getElementById('ruPageRole').value;\n enabled=(window.rolesRoleDefault&&window.rolesRoleDefault(role))||[];\n}\nfunction renderPerms(){\n var body=document.getElementById('ruPermBody');if(!body)return;\n body.innerHTML=pageGroups().map(function(g){\n  return '<div class=\"permission-group-title'+(/manage/i.test(g[0])?' manage':'')+'\">'+g[0]+'<\u002Fdiv><div class=\"permission-grid\">'+\n   g[1].map(function(pg){\n    var on=enabled.indexOf(pg[0])>-1,lk=!!pg[3];\n    return '<div class=\"permission-item'+(lk?' locked':'')+'\"><div><strong>'+pg[1]+(lk?' <span class=\"permission-lock\">▣<\u002Fspan>':'')+'<\u002Fstrong><small>'+pg[2]+'<\u002Fsmall><\u002Fdiv>'+\n     '<label class=\"client-page-switch\"><input type=\"checkbox\" data-page=\"'+pg[0]+'\"'+(on?' checked':'')+(lk?' checked disabled':'')+'><span><\u002Fspan><\u002Flabel><\u002Fdiv>';\n   }).join('')+'<\u002Fdiv>';\n }).join('');\n document.getElementById('ruPermSummary').textContent=enabled.length+' enabled';\n body.querySelectorAll('input:not(:disabled)').forEach(function(i){\n  i.onchange=function(){\n   var id=this.dataset.page;\n   if(this.checked){if(enabled.indexOf(id)<0)enabled.push(id)}\n   else enabled=enabled.filter(function(v){return v!==id});\n   document.getElementById('ruPermSummary').textContent=enabled.length+' enabled';\n  };\n });\n}\nfunction fillRoles(){\n var sel=document.getElementById('ruPageRole');if(!sel)return;\n var cur=sel.value;\n sel.innerHTML=ROLES.map(function(r){return '<option'+(r===cur?' selected':'')+'>'+r+'<\u002Foption>'}).join('');\n}\nfunction open(rec){\n var v=document.getElementById('roleEditorView')||buildPage();if(!v)return;\n document.querySelectorAll('.content').forEach(function(el){el.style.display='none'});\n v.style.display='block';\n document.body.classList.add('role-editor-open');\n if(typeof window.setEditorShell==='function')window.setEditorShell(true);\n ['ruPageName','ruPageEmail','ruPageTitle','ruPagePhone','ruPagePassword'].forEach(function(id){var e=document.getElementById(id);if(e)e.value=''});\n document.getElementById('ruPageActive').checked=true;\n document.getElementById('ruPageWelcome').checked=(!rec);\n document.getElementById('roleEditorError').textContent='';\n editingRow=(rec&&rec.row)||null;\n setMode(rec?'edit':'create');\n fillRoles();\n if(rec){\n  document.getElementById('ruPageName').value=rec.name||'';\n  document.getElementById('ruPageEmail').value=rec.email||'';\n  document.getElementById('ruPageTitle').value=rec.title||'';\n  var sel=document.getElementById('ruPageRole');\n  if(rec.role&&ROLES.indexOf(rec.role)<0){ROLES.push(rec.role);fillRoles()}\n  if(rec.role)sel.value=rec.role;\n  enabled=(rec.enabled&&rec.enabled.slice())||(window.rolesRoleDefault&&window.rolesRoleDefault(sel.value))||[];\n }else resetPerms();\n renderPerms();\n window.scrollTo(0,0);v.scrollTop=0;\n var m=document.querySelector('.main');if(m)m.scrollTop=0;\n}\nfunction close(){\n var v=document.getElementById('roleEditorView');if(v)v.style.display='none';\n document.body.classList.remove('role-editor-open');\n if(typeof window.setEditorShell==='function')window.setEditorShell(false);\n if(typeof window.showView==='function')window.showView('roles');\n}\nfunction initials(n){return n.split(/\\s+/).map(function(x){return x.charAt(0)}).join('').slice(0,2).toUpperCase()}\nfunction save(){\n var name=document.getElementById('ruPageName').value.trim(),\n     email=document.getElementById('ruPageEmail').value.trim(),\n     role=document.getElementById('ruPageRole').value,\n     err=document.getElementById('roleEditorError');\n if(!name){err.textContent='Full name is required';return}\n if(!/.+@.+\\..+/.test(email)){err.textContent='A valid email address is required';return}\n err.textContent='';\n var t=document.getElementById('flatRoleUsers');\n var total=(window.rolesTotalPages&&window.rolesTotalPages())||17;\n var base=(window.rolesDefaultCount&&window.rolesDefaultCount(role))||total;\n var custom=enabled.length!==base;\n if(mode==='edit'&&editingRow){\n  var u=editingRow.querySelector('.fru-user');\n  if(u){u.querySelector('.fru-avatar').textContent=initials(name);\n   u.querySelector('strong').textContent=name;\n   var sm=u.querySelector('small');if(sm)sm.textContent=email;}\n  var rl=editingRow.querySelector('.fru-role');if(rl)rl.textContent=role;\n  var md=editingRow.querySelector('.fru-mod')||editingRow.children[2];if(md)md.textContent=enabled.length+' / '+total;\n  var ac=editingRow.querySelector('.fru-access');if(ac)ac.textContent=custom?'Customized':'Role default';\n  editingRow.dataset.roleName=r
